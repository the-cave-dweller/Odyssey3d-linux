# Configuración de `odysseyvk serve` (se lee de ~/.config/odysseyvk/serve.conf).
# Una clave por línea, con el valor tras el "="; las líneas que empiezan por # se ignoran.

# app_id de las ventanas que NUNCA se ofrecen en 3D (lista separada por comas).
# La comprobación es "contiene", así que "plasma" cubre plasmashell y compañía.
ignore = odysseyvk, plasmashell, plasma, kscreen, polkit, xwayland, krunner, yakuake

# Segundos que se queda el aviso en pantalla antes de retirarse solo.
espera = 40

# ask   = preguntar siempre con el aviso (botones 3D lado a lado / arriba-abajo / 2D plano)
# sbs   = pasar a 3D lado a lado sin preguntar
# tb    = pasar a 3D arriba y abajo sin preguntar
# flat  = dejar en 2D sin tocar lente, scaler ni pantalla, salvo las aplicaciones y juegos apuntados en «auto»
modo = ask

# Excepciones por aplicación, para no volver a preguntar con esa. Se escriben solas cuando se
# marca la casilla de la tarjeta y se pulsa un boton; se pueden editar a mano:
#   auto = mpv:sbs
#   auto = haruna:tb, vlc:flat

# Las dos redes de profundidad que ofrece el boton 1 / 2 de la pastilla del visor (y las teclas
# sueltas 1 y 2):
#   modelo  = la del boton 1, la de Samsung (.onnx llamada mde_* o disp_*)
#   nuestra = la del boton 2, la nuestra (depth_anything_v2_small.onnx)
# Al pulsar el boton se guarda la eleccion en ~/.config/odysseyvk/red-elegida y al arrancar el
# servicio se vuelve a ella. Si no escribe "nuestra", se busca en
# ~/.local/share/odysseyvk/modelos/depth_anything_v2_small.onnx.
# (La clave "red" es otra cosa: dice en que tarjeta grafica corre la red.)

# Seguimiento de los ojos con la camara IR del monitor (04e8:20d7). Con rastreo = si el hub pasa
# --track al visor y la trama se recalcula segun la posicion de tus ojos; con rastreo = no la trama
# vive para la posicion de ojo nominal de fabrica.
#   rastreo   = si | no
#   suavizado = 0,35   (0 a 1; mas pequeño responde antes y se mueve mas. Si se omite, el visor
#                       usa su valor de fabrica, 0,35)
# Si la camara esta colgada el visor avisa `[rastreo] no arranco: ...` y la sesion sigue adelante
# con la posicion nominal. Mira `odysseyvk ctl camera` y `odysseyvk doctor` antes de culpar al rastreo.
rastreo = si
suavizado = 0,35
